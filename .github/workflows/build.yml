
name: PSSMP API Part 1

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  build:
    name: Build API JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Check Java version
        run: java -version

      - name: Build with Maven
        run: mvn -B -U clean verify

      - name: Upload PSSMP API JAR
        uses: actions/upload-artifact@v4
        with:
          name: PSSMP-API-Part-1
          path: target/pssmp-api-1.0.0.jar
          if-no-files-found: error
          retention-days: 30
