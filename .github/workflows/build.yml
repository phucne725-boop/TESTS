
name: PSSMP Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract source ZIP
        run: |
          mkdir -p source
          ZIP_COUNT=$(find . -maxdepth 1 -type f -iname "*.zip" | wc -l)

          if [ "$ZIP_COUNT" -ne 1 ]; then
            echo "Expected exactly one source ZIP, found $ZIP_COUNT"
            exit 1
          fi

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)
          unzip -q "$ZIP_FILE" -d source

      - name: Find pom.xml
        id: project
        run: |
          POM=$(find source -name pom.xml -print -quit)

          if [ -z "$POM" ]; then
            echo "ERROR: No pom.xml found inside ZIP"
            exit 1
          fi

          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "Found: $POM"

      - name: Build with Maven
        run: mvn -B -f "${{ steps.project.outputs.pom }}" clean package -DskipTests

      - name: Collect JAR
        run: |
          mkdir -p build-artifacts
          find source -path "*/target/*.jar" -type f \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} build-artifacts/ \;

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PSSMP-Build
          path: build-artifacts/*.jar
          if-no-files-found: error
