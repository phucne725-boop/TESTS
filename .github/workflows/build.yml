
name: PSSMP API Part 1 Build

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Extract ZIP and Build JAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Install ZIP Tools
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Find and Extract ZIP
        id: extract
        shell: bash
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found!"
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir -p extracted
          unzip -o "$ZIP_FILE" -d extracted

          POM_FILE=$(find extracted -type f -name "pom.xml" | head -n 1)

          if [ -z "$POM_FILE" ]; then
            echo "ERROR: pom.xml not found inside ZIP!"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$POM_FILE")

          echo "Project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build with Maven
        run: mvn -B -U clean verify
        working-directory: ${{ steps.extract.outputs.project_dir }}

      - name: Verify JAR
        id: verify
        shell: bash
        run: |
          set -e

          JAR_FILE="${{ steps.extract.outputs.project_dir }}/target/pssmp-api-1.0.0.jar"

          if [ ! -f "$JAR_FILE" ]; then
            echo "ERROR: Expected JAR was not generated!"
            find "${{ steps.extract.outputs.project_dir }}/target" -maxdepth 1 -type f
            exit 1
          fi

          echo "jar_path=$JAR_FILE" >> "$GITHUB_OUTPUT"
          ls -lh "$JAR_FILE"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: PSSMP-API-Part-1
          path: ${{ steps.verify.outputs.jar_path }}
          if-no-files-found: error
          retention-days: 30
