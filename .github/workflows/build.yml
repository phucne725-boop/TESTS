name: Build PSSMP Core
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Giải nén source
        run: |
          ls -la
          ZIP="$(find . -maxdepth 2 -iname '*Part3*.zip' | head -1)"
          echo "Tìm thấy: $ZIP"
          test -n "$ZIP" || { echo "Không có file ZIP Part3 trong repo"; exit 1; }
          mkdir build-source
          unzip -q "$ZIP" -d build-source

      - name: Build
        run: |
          cd "$(dirname "$(find build-source -name pom.xml | head -1)")"
          mvn clean package -DskipTests

      - uses: actions/upload-artifact@v4
        with:
          name: pssmp-core-jar
          path: build-source/**/target/pssmp-core-1.0.0.jar
