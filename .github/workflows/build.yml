
name: PSSMP Core Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Core-Part2
            zip: PSSMP_Core_1.0_Part2.zip

          - name: Core-Part3-Full
            zip: PSSMP_Core_1.0_Part3_Full.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check ZIP
        shell: bash
        run: |
          if [ ! -f "${{ matrix.zip }}" ]; then
            echo "::error::Missing ZIP: ${{ matrix.zip }}"
            exit 1
          fi

          echo "ZIP found: ${{ matrix.zip }}"

      - name: Extract ZIP
        shell: bash
        run: |
          mkdir -p build-source
          unzip -q "${{ matrix.zip }}" -d build-source

          echo "Source extracted successfully"

      - name: Find Maven Project
        id: project
        shell: bash
        run: |
          POM=$(find build-source -name pom.xml -print -quit)

          if [ -z "$POM" ]; then
            echo "::error::pom.xml not found inside ZIP"
            exit 1
          fi

          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM"

      - name: Fix Paper API Version
        shell: bash
        run: |
          POM="${{ steps.project.outputs.pom }}"

          sed -i \
            's/26\.1\.2-R0\.1-SNAPSHOT/[26.3.build,)/g' \
            "$POM"

          echo "Paper API configuration:"
          grep -n -A3 -B2 "paper-api" "$POM"

      - name: Build with Maven
        shell: bash
        run: |
          mvn -U -B \
            -f "${{ steps.project.outputs.pom }}" \
            clean package -DskipTests

      - name: Find JAR
        id: jar
        shell: bash
        run: |
          JAR=$(find build-source -type f \
            -path '*/target/*.jar' \
            ! -name 'original-*.jar' \
            | head -n 1)

          if [ -z "$JAR" ]; then
            echo "::error::No JAR file was generated"
            exit 1
          fi

          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "Generated JAR: $JAR"

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSSMP-${{ matrix.name }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30
