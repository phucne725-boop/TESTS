
name: PSSMP Build All

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API-Part1
            zip: PSSMP_API_1.0_Part1.zip

          - name: Core-Part2
            zip: PSSMP_Core_1.0_Part2.zip

          - name: Core-Part3-Full
            zip: PSSMP_Core_1.0_Part3_Full.zip

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Check ZIP
        run: |
          test -f "${{ matrix.zip }}" || {
            echo "::error::Missing ZIP: ${{ matrix.zip }}"
            exit 1
          }

      - name: Extract ZIP
        run: |
          mkdir -p build-source
          unzip -q "${{ matrix.zip }}" -d build-source

      - name: Find pom.xml
        id: project
        shell: bash
        run: |
          POM=$(find build-source -name pom.xml -print -quit)

          if [ -z "$POM" ]; then
            echo "::error::pom.xml not found"
            exit 1
          fi

          echo "pom=$POM" >> "$GITHUB_OUTPUT"
          echo "Found Maven project: $POM"

      - name: Build with Maven
        run: |
          mvn -B -f "${{ steps.project.outputs.pom }}" clean package -DskipTests

      - name: Find JAR
        id: jar
        shell: bash
        run: |
          JAR=$(find build-source -type f -path '*/target/*.jar' \
            ! -name 'original-*.jar' | head -n 1)

          if [ -z "$JAR" ]; then
            echo "::error::Build did not produce a JAR"
            exit 1
          fi

          echo "path=$JAR" >> "$GITHUB_OUTPUT"
          echo "JAR created: $JAR"

      - name: Upload JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PSSMP-${{ matrix.name }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 30
