
name: Auto Build PS-SMP

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Create Project Automatically
        run: |
          mkdir -p src/main/java/me/phutsmile/pssmp
          mkdir -p src/main/resources

          cat > pom.xml <<'EOF'
          <project xmlns="http://maven.apache.org/POM/4.0.0"
                   xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                   xsi:schemaLocation="http://maven.apache.org/POM/4.0.0 https://maven.apache.org/xsd/maven-4.0.0.xsd">
            <modelVersion>4.0.0</modelVersion>
            <groupId>me.phutsmile</groupId>
            <artifactId>ps-smp</artifactId>
            <version>1.0.0</version>
            <properties>
              <maven.compiler.release>25</maven.compiler.release>
              <project.build.sourceEncoding>UTF-8</project.build.sourceEncoding>
            </properties>
            <repositories>
              <repository>
                <id>papermc</id>
                <url>https://repo.papermc.io/repository/maven-public/</url>
              </repository>
            </repositories>
            <dependencies>
              <dependency>
                <groupId>io.papermc.paper</groupId>
                <artifactId>paper-api</artifactId>
                <version>26.1.2.build.64-stable</version>
                <scope>provided</scope>
              </dependency>
            </dependencies>
            <build>
              <plugins>
                <plugin>
                  <groupId>org.apache.maven.plugins</groupId>
                  <artifactId>maven-compiler-plugin</artifactId>
                  <version>3.14.1</version>
                  <configuration>
                    <release>25</release>
                  </configuration>
                </plugin>
              </plugins>
            </build>
          </project>
          EOF

          cat > src/main/java/me/phutsmile/pssmp/PSSMP.java <<'EOF'
          package me.phutsmile.pssmp;

          import org.bukkit.plugin.java.JavaPlugin;

          public final class PSSMP extends JavaPlugin {

              @Override
              public void onEnable() {
                  getLogger().info("PS-SMP enabled!");
              }

              @Override
              public void onDisable() {
                  getLogger().info("PS-SMP disabled!");
              }
          }
          EOF

          cat > src/main/resources/plugin.yml <<'EOF'
          name: PSSMP
          version: 1.0.0
          main: me.phutsmile.pssmp.PSSMP
          author: PhutSmile
          description: PS-SMP Plugin
          EOF

      - name: Build JAR
        run: mvn -B clean package

      - name: Upload Plugin
        uses: actions/upload-artifact@v4
        with:
          name: PS-SMP-Plugin
          path: target/*.jar
